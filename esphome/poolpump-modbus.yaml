# ESPHome-config för poolvärmepump via Modbus RTU.
#
# Ersätter den ursprungliga Tuya-WiFi-modulen: samma 4-poliga kontakt, samma
# 12 V-matning, men lokal styrning mot Home Assistant utan moln.
#
# Hårdvara: LilyGO T-CAN485 (ESP32 + MAX13487E + 12 V-ingång). GPIO-numren
# nedan gäller det kortet — byt dem om du använder ett annat.
#
# OBS: registerkartan nedan följer docs/04-registerkarta.md och gäller
# Fairland-familjen — INTE PHNIX/KMP Smart 60. Använd den som mall och byt ut
# adresser och skalningar mot det du kartlagt med tools/modbus_probe.py --watch.
# Se docs/05-kmp-smart-60.md.
# Härledd från https://github.com/Elwell/pool-heatpump (Apache-2.0).

substitutions:
  name_prefix: Poolvärmepump

esphome:
  name: poolpump-controller
  comment: Modbus RTU-brygga mot poolvärmepump
  on_boot:
    then:
      - output.turn_on: bus_power
      - output.turn_on: rs485_en
      - output.turn_on: rs485_se

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Poolpump fallback"

captive_portal:

# T-CAN485: 5 V-skenan och RS485-transceivern måste slås på aktivt.
output:
  - platform: gpio
    pin: GPIO17
    id: rs485_en
  - platform: gpio
    pin: GPIO19
    id: rs485_se
  - platform: gpio
    pin: GPIO16
    id: bus_power

uart:
  id: uart_modbus
  rx_pin: GPIO21
  tx_pin: GPIO22
  baud_rate: 9600
  # Lägg till parity/stop_bits här om --scan gav något annat än 8N1.

modbus:
  id: modbus_bus
  uart_id: uart_modbus

modbus_controller:
  - id: heatpump
    modbus_id: modbus_bus
    address: 1
    update_interval: 10s

switch:
  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: ${name_prefix} På
    register_type: coil
    address: 0

  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: ${name_prefix} Manuell avfrostning
    register_type: coil
    address: 1
    disabled_by_default: true

binary_sensor:
  - platform: status
    name: ${name_prefix} Uppkopplad

  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: ${name_prefix} Driftstatus
    register_type: discrete_input
    address: 0
    device_class: power

  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: ${name_prefix} Avfrostar
    register_type: discrete_input
    address: 1
    device_class: cold

  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: ${name_prefix} Vattenflöde
    register_type: discrete_input
    address: 4

  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: ${name_prefix} Fel
    register_type: discrete_input
    address: 16
    device_class: problem

  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: ${name_prefix} Kompressor går
    register_type: discrete_input
    address: 17
    device_class: running

sensor:
  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: ${name_prefix} Vatten in
    register_type: read
    address: 3
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    filters:
      - offset: -60
      - multiply: 0.5

  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: ${name_prefix} Vatten ut
    register_type: read
    address: 4
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    filters:
      - offset: -60
      - multiply: 0.5

  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: ${name_prefix} Utomhustemperatur
    register_type: read
    address: 5
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    filters:
      - offset: -60
      - multiply: 0.5

  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: ${name_prefix} Kompressorfrekvens
    register_type: read
    address: 10
    value_type: U_WORD
    unit_of_measurement: "Hz"
    device_class: frequency

  - platform: modbus_controller
    modbus_controller_id: heatpump
    id: pump_current
    name: ${name_prefix} Kompressorström
    register_type: read
    address: 11
    value_type: U_WORD
    unit_of_measurement: "A"
    device_class: current
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: heatpump
    id: pump_voltage
    name: ${name_prefix} PFC-spänning
    register_type: read
    address: 2
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    entity_category: diagnostic

  - platform: template
    name: ${name_prefix} Effekt
    device_class: power
    unit_of_measurement: "W"
    update_interval: 10s
    lambda: |-
      if (isnan(id(pump_current).state) || isnan(id(pump_voltage).state)) {
        return 0.0;
      }
      return id(pump_current).state * id(pump_voltage).state;

number:
  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: ${name_prefix} Börvärde värme
    address: 3
    value_type: U_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 18
    max_value: 40
    step: 0.5
    lambda: "return (x - 60) / 2;"
    write_lambda: "return (x * 2) + 60;"

select:
  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: ${name_prefix} Funktion
    address: 0
    value_type: U_WORD
    optionsmap:
      "Auto": 0
      "Värme": 1
      "Kyla": 2

  - platform: modbus_controller
    modbus_controller_id: heatpump
    name: ${name_prefix} Driftläge
    address: 1
    value_type: U_WORD
    optionsmap:
      "Smart": 0
      "Tyst": 1
      "Turbo": 3
